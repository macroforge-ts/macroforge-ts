[workspace]
authors = ["rymskip <17lochinskij@protonmail.com>"]
channels = ["conda-forge"]
name = "macroforge"
platforms = ["osx-64"]
version = "0.1.0"
[tasks]
# Build mf tooling binary
"build:mf" = { cmd = "cd tooling/scripts && cargo build --release" }

# Core builds
build = { cmd = "pixi run build:rust && pixi run build:plugin" }
"build:rust" = { cmd = "cd crates/macroforge_ts && deno task build" }
"build:website" = { cmd = "cd website && deno task build" }
"build:plugin" = { cmd = "cd packages/vite-plugin && deno task build" }
"build:@playground/macro" = { cmd = "cd tooling/playground/macro && deno task build" }
"build:@playground/svelte" = "cd tooling/playground/svelte && deno task build"
"build:@playground/vanilla" = "cd tooling/playground/vanilla && deno task build"
"build:playground" = "pixi run build:@playground/macro && pixi run build:@playground/svelte && pixi run build:@playground/vanilla"

# Tests
"test:rust" = { cmd = "tooling/scripts/target/release/mf test rust" }
"test:packages" = { cmd = "tooling/scripts/target/release/mf test packages" }
"test:playground" = { cmd = "tooling/scripts/target/release/mf test playground" }
"test:all" = { cmd = "tooling/scripts/target/release/mf test all" }
"test:e2e:zed" = { cmd = "./tooling/tests/e2e/run-zed-test.sh" }
"test:e2e:zed:verbose" = { cmd = "./tooling/tests/e2e/run-zed-test.sh --verbose" }
"test:e2e:zed:node" = { cmd = "node --test tooling/tests/e2e/zed-extension-startup.test.js" }

# Diagnostics (using mf)
diagnostics = { cmd = "tooling/scripts/target/release/mf diagnostics" }
"diagnostics:log" = { cmd = "tooling/scripts/target/release/mf diagnostics --log" }
"diagnostics:json" = { cmd = "tooling/scripts/target/release/mf diagnostics --json" }

# Macros
"macro:expand" = { cmd = "cargo run -p ts_macro_cli -- expand --use-node" }
"macro:tsc" = { cmd = "cargo run -p ts_macro_cli -- tsc" }
"expand:playground" = { cmd = "tooling/scripts/target/release/mf expand" }

# Clean builds (using mf)
"cleanbuild:all" = { cmd = "tooling/scripts/target/release/mf build --repos all" }
"cleanbuild:ts" = { cmd = "tooling/scripts/target/release/mf build --repos ts" }
"cleanbuild:rust" = { cmd = "tooling/scripts/target/release/mf build --repos rust" }

# Version management (using mf)
bump = { cmd = "tooling/scripts/target/release/mf prep --bump-only" }
sync = { cmd = "tooling/scripts/target/release/mf prep --sync-versions --bump-only" }
rebase = { cmd = "tooling/scripts/target/release/mf versions" }

# Documentation (using mf)
"docs:book" = { cmd = "tooling/scripts/target/release/mf docs build-book" }
"docs:mcp" = { cmd = "rust-script packages/mcp-server/scripts/extract-docs.rs" }
"docs:api" = { cmd = "tooling/scripts/target/release/mf docs extract-rust && tooling/scripts/target/release/mf docs extract-ts" }
"docs:readmes" = { cmd = "tooling/scripts/target/release/mf docs generate-readmes" }
"docs:all" = { cmd = "tooling/scripts/target/release/mf docs all" }
"docs:check" = { cmd = "tooling/scripts/target/release/mf docs check-freshness" }

# Release workflow (using mf)
verify = { cmd = "tooling/scripts/target/release/mf verify" }
"verify:dry" = { cmd = "tooling/scripts/target/release/mf verify --dry-run" }
commit = { cmd = "tooling/scripts/target/release/mf commit" }
"commit:dry" = { cmd = "tooling/scripts/target/release/mf commit --dry-run" }
push = { cmd = "tooling/scripts/target/release/mf push" }
"push:dry" = { cmd = "tooling/scripts/target/release/mf push --dry-run" }
"publish:skip-build" = { cmd = "tooling/scripts/target/release/mf publish-local --skip-build" }
publish = { cmd = "tooling/scripts/target/release/mf publish-local" }
"publish:dry" = { cmd = "tooling/scripts/target/release/mf publish-local --dry-run" }

# Manifest manipulation (using mf)
"manifest:list" = { cmd = "tooling/scripts/target/release/mf manifest list" }
"manifest:swap-local" = { cmd = "tooling/scripts/target/release/mf manifest swap-local" }
"manifest:swap-registry" = { cmd = "tooling/scripts/target/release/mf manifest swap-registry" }

"install:cli" = {cmd= "cargo install --path crates/macroforge_ts"}
bench = { cmd = "deno run -A tooling/scripts/bench.mjs" }
"bench:all" = { cmd = "deno run -A tooling/scripts/bench.mjs --all" }
"bench:build" = { cmd = "deno run -A tooling/scripts/bench.mjs --build" }
"build:all-concurrent" = { cmd = "deno run -A npm:concurrently -n cli,wasm,macro 'pixi run install:cli' 'pixi run build:rust' 'pixi run build:@playground/macro'" }

# TUI dashboard
scripts = { cmd = "tooling/scripts/target/release/mf --tui" }

[dependencies]
