[workspace]
authors = ["rymskip <17lochinskij@protonmail.com>"]
channels = [
    "conda-forge",
    "https://prefix.dev/brads-forge",
    # Deno tracks upstream releases here (conda-forge lags and lacks `upgrade`).
    "https://prefix.dev/github-releases",
]
name = "macroforge"
platforms = ["osx-64", "linux-64"]
version = "0.1.0"
[tasks]
# One-shot per-machine bootstrap. Installs global rustup from brads-forge if
# missing, drops cargo/rustc/etc. symlinks into ~/.cargo/bin so the rustup
# multicall dispatch works (pixi expose wrappers don't preserve argv[0]), and
# appends RUSTUP_HOME to ~/.zshenv. Safe to re-run.
"setup-rust" = "bash scripts/setup-rust.sh"

# Build mf tooling binary. Debug, since it only orchestrates other tools and
# rebuilds far faster than an optimized build.
"build:mf" = { cmd = "cargo build -p mf" }

# Core builds
build = { cmd = "pixi run build:rust && pixi run build:plugin" }
"build:rust" = { cmd = "cd crates/macroforge_ts && deno task build" }
"build:website" = { cmd = "cd website && deno task build" }
"build:plugin" = { cmd = "cd packages/vite-plugin && deno task build" }
"build:@playground/macro" = { cmd = "cd tooling/playground/macro && deno task build" }
"build:@playground/svelte" = "cd tooling/playground/svelte && deno task build"
"build:@playground/vanilla" = "cd tooling/playground/vanilla && deno task build"
"build:@playground/library" = "cd tooling/playground/library && deno task build"
"build:playground" = "pixi run build:@playground/macro && pixi run build:@playground/svelte && pixi run build:@playground/vanilla && pixi run build:@playground/library"

# Tests
"test:rust" = { cmd = "target/debug/mf test rust" }
"test:packages" = { cmd = "target/debug/mf test packages" }
"test:playground" = { cmd = "target/debug/mf test playground" }
"test:all" = { cmd = "target/debug/mf test all" }
"test:e2e:zed" = { cmd = "./tooling/tests/e2e/run-zed-test.sh" }
"test:e2e:zed:verbose" = { cmd = "./tooling/tests/e2e/run-zed-test.sh --verbose" }
"test:e2e:zed:node" = { cmd = "node --test tooling/tests/e2e/zed-extension-startup.test.js" }

# Diagnostics (using mf)
diagnostics = { cmd = "target/debug/mf diagnostics" }
"diagnostics:log" = { cmd = "target/debug/mf diagnostics --log" }
"diagnostics:json" = { cmd = "target/debug/mf diagnostics --json" }

# Clean builds (using mf)
"cleanbuild:all" = { cmd = "target/debug/mf build --repos all" }
"cleanbuild:ts" = { cmd = "target/debug/mf build --repos ts" }
"cleanbuild:rust" = { cmd = "target/debug/mf build --repos rust" }

# Version management (using mf)
bump = { cmd = "target/debug/mf bump" }
sync = { cmd = "target/debug/mf bump --sync-versions" }
rebase = { cmd = "target/debug/mf versions" }

# Documentation (using mf)
"docs:mcp" = { cmd = "rust-script packages/mcp-server/scripts/extract-docs.rs" }
"docs:api" = { cmd = "target/debug/mf docs extract-rust && target/debug/mf docs extract-ts" }
"docs:readmes" = { cmd = "target/debug/mf docs generate-readmes" }
"docs:all" = { cmd = "target/debug/mf docs all" }
"docs:check" = { cmd = "target/debug/mf docs check-freshness" }

# Release workflow (using mf)
verify = { cmd = "target/debug/mf verify" }
push = { cmd = "target/debug/mf push" }
"push:dry" = { cmd = "target/debug/mf push --dry-run" }
"publish:skip-build" = { cmd = "target/debug/mf publish-local --skip-build" }
publish = { cmd = "target/debug/mf publish-local" }
"publish:dry" = { cmd = "target/debug/mf publish-local --dry-run" }

# Manifest manipulation (using mf)
"manifest:list" = { cmd = "target/debug/mf manifest list" }

# Builds the CLI into target/debug, which `MACROFORGE_CLI` points every task
# and test at. Nothing is installed: a `macroforge` on PATH belongs to other
# projects and stays at the version they pin.
"build:cli" = { cmd = "cargo build -p macroforge_ts --bin macroforge" }
bench = { cmd = "deno run -A tooling/scripts/bench.mjs" }
"bench:all" = { cmd = "deno run -A tooling/scripts/bench.mjs --all" }
"bench:build" = { cmd = "deno run -A tooling/scripts/bench.mjs --build" }
"build:all-concurrent" = { cmd = "deno run -A npm:concurrently -n cli,wasm,macro 'pixi run build:cli' 'pixi run build:rust' 'pixi run build:@playground/macro'" }

# TUI dashboard
scripts = { cmd = "target/debug/mf --tui" }

# wasm-bindgen-cli is not on conda-forge, so we cargo-install it at the
# exact version pinned by the Rust workspace lockfile. Without this, the
# wasm-pack cache may hand `bench.mjs` a newer CLI that rejects the .wasm
# with a "schema version mismatch" error. Run once per machine:
#   pixi run setup:wasm-bindgen
"setup:wasm-bindgen" = { cmd = "cargo install wasm-bindgen-cli --version 0.2.128 --locked" }

[dependencies]
# Rust toolchain manager from brads-forge. The active rust version, components,
# and targets are pinned in rust-toolchain.toml at the repo root — rustup
# auto-installs that toolchain on first cargo invocation. RUSTUP_HOME is
# shared with the global rustup install via [activation.env] below.
rustup = "*"
# Deno — `deno task build` across crates/macroforge_ts, packages/*, website,
# and `deno run` for bench.mjs / concurrently. From the github-releases channel.
deno = { version = "*", channel = "https://prefix.dev/github-releases" }
# Node + npm — `node --test` e2e harness (tooling/tests/e2e) and npm-driven
# package builds shelled out from the tooling crate.
nodejs = "*"
# `rust-script` runs the docs:mcp extract-docs.rs script.
rust-script = ">=0.36"
# `wasm-pack` builds the macroforge_ts wasm artifact (see build:rust / bench.mjs;
# the wasm-bindgen-cli version is pinned separately via `setup:wasm-bindgen`).
wasm-pack = ">=0.15"
rust-std-wasm32-unknown-unknown = ">=1.97.1,<2"
cargo-nextest = ">=0.9.140,<0.10"

[activation.env]
RUSTUP_HOME = "$HOME/.pixi/envs/rustup/.rustup"
# Pixi's rust integration defaults CARGO_HOME to the env (`$CONDA_PREFIX/.cargo`),
# which the rustup activate.d script puts on PATH ahead of ~/.cargo/bin, so a
# tool cargo-installed inside `pixi run` would shadow the global copy there and
# the two would diverge. Pin CARGO_HOME to the user default so there is one.
CARGO_HOME = "$HOME/.cargo"
# The CLI every task and test drives: this checkout's debug build, never the
# `macroforge` on PATH.
MACROFORGE_CLI = "$PIXI_PROJECT_ROOT/target/debug/macroforge"

# mold linker — Linux only. `.cargo/config.toml` sets `-fuse-ld=mold` for the
# linux target; this puts `mold` on the env PATH so cargo finds it. macOS uses
# Apple's ld-prime and doesn't need it.
[target.linux-64.dependencies]
mold = ">=2.40"
