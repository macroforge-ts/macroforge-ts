[package]
name = "mf"
version = "0.1.0"
edition = "2024"
description = "Macroforge Tooling - unified CLI/TUI for build, release, and diagnostics"
publish = false

[[bin]]
name = "mf"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dialoguer = "0.12.0"

# TUI
ratatui = "0.30.0-beta.0"
crossterm = "0.29.0"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object keys in file order. Without it every manifest
# rewrite sorts them, which reorders npm export conditions and puts `default`
# ahead of `types`, making the later conditions unreachable.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9.10"

# Graphs
petgraph = "0.8.3"

# Rust parsing
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = "1"


# SWC Core for TypeScript parsing and transformation
swc_core = { version = "54.0.0", features = [
    "ecma_ast",
    "ecma_parser",
    "common"
] }


# Markdown
pulldown-cmark = "0.13"
htmd = "0.5"
scraper = "0.25"

# Terminal
colored = "3.0.0"

# Utils
regex = "1"
walkdir = "2"
ignore = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
ctrlc = "3.4"
ureq = { version = "3.1.4", features = ["json"] }
rayon = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
