[package]
name = "mf"
version = "0.1.0"
edition.workspace = true
description = "Macroforge tooling: build, verify, document and release the monorepo"
publish = false

[[bin]]
name = "mf"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true }
dialoguer = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Rust parsing
syn = { workspace = true }
quote = { workspace = true }

# TypeScript parsing for API doc extraction
oxc = { workspace = true }

# Markdown
htmd = { workspace = true }
html-escape = { workspace = true }
scraper = { workspace = true }

# Terminal
colored = { workspace = true }

# Utils
regex = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
anyhow = { workspace = true }
ureq = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
