# Pull requests into main run `verify`, as GitLab merge requests do, on a
# GitHub-hosted runner in the image tooling/ci/Dockerfile defines. Releases
# stay on GitLab.
name: CI

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-24.04
        timeout-minutes: 180
        env:
            # The build and the container's home live on the runner's larger
            # scratch disk.
            CI_HOME: /mnt/ci/home
            CI_TARGET: /mnt/ci/target
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Prepare the scratch disk
              run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$CI_HOME" "$CI_TARGET"

            # The rustup toolchain, cargo-installed tools, and the pixi and
            # Deno package caches.
            - name: Restore the home cache
              id: home-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: /mnt/ci/home
                  key: home-${{ hashFiles('rust-toolchain.toml', 'pixi.lock', 'Cargo.lock', '**/deno.lock') }}
                  restore-keys: home-

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build the CI image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: tooling/ci
                  tags: macroforge-ci
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # The checkout belongs to the runner user, so git inside the
            # container, running as root, needs it marked safe.
            - name: Verify
              run: >-
                  docker run --rm
                  --volume "$GITHUB_WORKSPACE:/work"
                  --volume "$CI_TARGET:/work/target"
                  --volume "$CI_HOME:/root"
                  --workdir /work
                  --env GIT_CONFIG_COUNT=1
                  --env GIT_CONFIG_KEY_0=safe.directory
                  --env GIT_CONFIG_VALUE_0=/work
                  macroforge-ci
                  bash -c 'pixi install --locked && pixi run setup && pixi run verify --check'

            # The container wrote the home as root; the cache action runs as
            # the runner user and has to read all of it.
            - name: Hand the home to the runner user
              if: ${{ !cancelled() && steps.home-cache.outputs.cache-hit != 'true' }}
              run: sudo chown -R "$(id -u):$(id -g)" "$CI_HOME"

            - name: Save the home cache
              if: ${{ !cancelled() && steps.home-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: /mnt/ci/home
                  key: ${{ steps.home-cache.outputs.cache-primary-key }}
