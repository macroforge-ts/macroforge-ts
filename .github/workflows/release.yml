# A vX.Y.Z tag pushed here (`pixi run tag --forge github`) verifies again,
# publishes every package whose version is not yet on its registry, creates the
# GitHub Release, then mirrors the tag and the release to GitLab, whose release
# webhook deploys the website. A tag GitLab already has came through its push
# mirror: GitLab's pipeline releases it and sync-releases.yml copies the release
# here.
name: Release

on:
    push:
        tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            release: ${{ steps.owner.outputs.release }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: ./.github/actions/gitlab
              with:
                  deploy-key: ${{ secrets.GITLAB_DEPLOY_KEY }}

            - name: Leave GitLab's own tags to GitLab
              id: owner
              run: |
                  if [ -n "$(git ls-remote --tags "$GITLAB_REPO" "refs/tags/$GITHUB_REF_NAME")" ]; then
                    echo "GitLab has $GITHUB_REF_NAME, so its pipeline releases it."
                    echo release=false >> "$GITHUB_OUTPUT"
                  else
                    echo release=true >> "$GITHUB_OUTPUT"
                  fi

            - name: Check the tag
              if: steps.owner.outputs.release == 'true'
              run: |
                  version="$(jq -r .version crates/macroforge_ts/package.json)"
                  if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match version $version in crates/macroforge_ts/package.json."
                    exit 1
                  fi
                  git fetch --quiet origin main
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
                    echo "::error::$GITHUB_REF_NAME is not on main; releases are tagged on main only."
                    exit 1
                  fi

    verify:
        needs: check
        if: needs.check.outputs.release == 'true'
        uses: ./.github/workflows/ci.yml

    publish-crates:
        needs: verify
        runs-on: ubuntu-24.04
        timeout-minutes: 180
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Prepare the CI image
              uses: ./.github/actions/ci-image

            - name: Set up the toolchain
              run: sh tooling/ci/run-in-image.sh 'pixi install --locked && pixi run setup'

            # The exchanged token lasts 30 minutes and is revoked when the job
            # ends, so it is requested right before the crates publish.
            - name: Authenticate to crates.io
              id: crates-io
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

            - name: Publish the crates
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
              run: sh tooling/ci/run-in-image.sh 'pixi run publish:ci:crates'

            - name: Build the npm and JSR packages
              run: sh tooling/ci/run-in-image.sh 'pixi run publish:ci:build'

            - name: Upload mf
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: mf
                  path: ${{ env.CI_TARGET }}/debug/mf
                  retention-days: 1
                  if-no-files-found: error

            - name: Upload the packages
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      npm/
                      crates/macroforge_ts/pkg-deno/
                  include-hidden-files: true
                  retention-days: 1
                  if-no-files-found: error

    # npm and JSR exchange the job's OIDC token themselves. JSR publishes after
    # npm, since it resolves the packages' npm imports of each other.
    publish-packages:
        needs: publish-crates
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download mf
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: mf
                  path: target/debug

            - name: Download the packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages

            # Artifacts do not keep the executable bit.
            - run: chmod +x target/debug/mf

            - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
              with:
                  pixi-version: v0.81.0
                  environments: publish
                  locked: true

            - name: Publish the packages
              run: pixi run --locked --environment publish publish:ci:packages

    # Created only once every registry has the version, so the release is the
    # signal that it shipped.
    release:
        needs: publish-packages
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
                    echo "The $GITHUB_REF_NAME release already exists."
                  else
                    gh release create "$GITHUB_REF_NAME" --verify-tag \
                      --title "$GITHUB_REF_NAME" --notes-file tooling/ci/release-notes.md
                  fi

    mirror:
        needs: release
        permissions:
            contents: write
        uses: ./.github/workflows/sync-releases.yml
        secrets: inherit
