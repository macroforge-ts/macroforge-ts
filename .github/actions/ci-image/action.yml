name: CI image
description: >-
    Builds the macroforge-ci image from tooling/ci/Dockerfile and restores the
    container's home onto the runner's scratch disk, for
    tooling/ci/run-in-image.sh.

outputs:
    cache-hit:
        description: Whether the home cache matched exactly.
        value: ${{ steps.home-cache.outputs.cache-hit }}
    cache-key:
        description: The key a changed home is saved under.
        value: ${{ steps.home-cache.outputs.cache-primary-key }}

runs:
    using: composite
    steps:
        # The build and the container's home live on the runner's larger
        # scratch disk.
        - name: Prepare the scratch disk
          shell: bash
          run: |
              home=/mnt/ci/home
              target=/mnt/ci/target
              sudo install -d -o "$(id -u)" -g "$(id -g)" "$home" "$target"
              {
                echo "CI_HOME=$home"
                echo "CI_TARGET=$target"
              } >> "$GITHUB_ENV"

        # The rustup toolchain, cargo-installed tools, and the pixi and Deno
        # package caches.
        - name: Restore the home cache
          id: home-cache
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ${{ env.CI_HOME }}
              key: home-${{ hashFiles('rust-toolchain.toml', 'pixi.lock', 'Cargo.lock', '**/deno.lock') }}
              restore-keys: home-

        - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name: Build the CI image
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
          with:
              context: tooling/ci
              tags: macroforge-ci
              load: true
              cache-from: type=gha
              cache-to: type=gha,mode=max
