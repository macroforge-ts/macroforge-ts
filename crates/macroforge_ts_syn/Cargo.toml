[package]
name = "macroforge_ts_syn"
description = "TypeScript syntax types for compile-time macro code generation"
version = "0.1.82"
edition = "2024"
authors = ["macroforge contributors"]
license = "MIT"
repository = "https://github.com/macroforge-ts/macroforge-ts"
homepage = "https://github.com/macroforge-ts/macroforge-ts"
keywords = ["typescript", "macros", "codegen", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"

[features]
default = ["oxc"]
swc = ["dep:swc_core"]
oxc = ["dep:oxc"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

swc_core = { version = "59.0.1", optional = true, default-features = false, features = [
  "common",
  "ecma_ast",
  "ecma_parser",
  "ecma_visit",
  "ecma_quote",
  "ecma_codegen",
] }

oxc = { version = "0.123", optional = true, features = ["codegen"] }

thiserror = "2.0.17"
indexmap = { version = "2.7", features = ["serde"] }
pathdiff = "0.2"