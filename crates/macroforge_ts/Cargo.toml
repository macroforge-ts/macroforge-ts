[package]
name = "macroforge_ts"
description = "TypeScript macro expansion engine - write build-time macros in Rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "macroforge"
path = "src/bin/cli/main.rs"

[dependencies]
# WASM Bindings
wasm-bindgen = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

# Oxc for TypeScript parsing and transformation
oxc = { workspace = true }

# Macroforge crates
macroforge_ts_syn = { workspace = true }
macroforge_ts_quote = { workspace = true }
macroforge_ts_macros = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Case conversion
convert_case = { workspace = true }

inventory = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# CLI
clap = { workspace = true }
ignore = { workspace = true }

# Watch command
notify-debouncer-full = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

# Buildtime sandbox — Boa (pure Rust JS engine). Compiles to both
# native and wasm32-unknown-unknown since there's no C code in the
# dependency tree. Optional; gated by `buildtime-boa`.
boa_engine = { workspace = true, optional = true }

# Selects the wasm randomness backend for Boa; see the workspace table.
getrandom = { workspace = true, optional = true }

# `web_time` is a drop-in replacement for `std::time::Instant` that
# works on wasm32-unknown-unknown (which has no monotonic clock in
# std). On native targets it re-exports the std types so the same
# code paths work in both environments.
web-time = { workspace = true, optional = true }

# Buildtime sandbox path matching. Used by the CapabilitySet to check
# whether a filesystem read/write is permitted.
globset = { workspace = true }

# Buildtime cross-platform time + digest helpers (sha2 is already
# listed above for the watch command; we reuse it in buildtime::api).
hex = { workspace = true }

# Unicode-aware identifier classification (UAX #31). Used by the
# declarative macro hygiene cursor to recognize identifier boundaries
# including non-ASCII characters like `__café` or `__中文`. Already
# transitively present via `oxc_syntax`; pulled in directly here so
# the dependency surface is explicit.
unicode-ident = { workspace = true }

# Concurrency
dashmap = { workspace = true }
rayon = { workspace = true }

# Runs wasm macro packages from the native host, so a crate built by
# `macroforge build` is loadable by the CLI and not only by a JS host.
#
# `wasmi` rather than wasmtime deliberately: a pure-Rust interpreter with no
# Cranelift backend keeps `cargo install macroforge` fast and the binary small.
# Macro expansion is a short, infrequent call, so JIT warm-up would cost more
# than it would save.
#
# Excluded from wasm builds — a wasm host has no business instantiating another
# wasm module, and the JS side already calls macros directly.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmi = { workspace = true }

[features]
default = ["wasm", "buildtime-boa"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]
# Buildtime sandbox — Boa (pure Rust). Compiles to native + wasm32.
buildtime-boa = ["dep:boa_engine", "dep:getrandom", "dep:web-time"]
# Register the `src/test_macros/` module — a small set of proc/attribute
# macros (@traced, $stringify, $concat_names) used exclusively by the
# snapshot test fixtures under `tests/fixtures/ok/{attribute,call}/`.
# These get registered via inventory just like the real built-ins, so
# they must NOT be enabled in production builds.
test-macros = []

[dev-dependencies]
trybuild = { workspace = true }
insta = { workspace = true }

# Criterion for microbenchmarking the declarative macro hot paths
# (PR 16). The `html_reports` feature generates an HTML report with
# throughput charts so regressions are easier to spot than raw
# stdout numbers.
criterion = { workspace = true }

[[bench]]
name = "declarative_composition"
harness = false

# Snapshot tests exercise built-in, declarative, and test-macros fixtures.
# `test-macros` is required so the `@traced`, `$stringify`, and
# `$concat_names` macros are registered in the inventory when the test
# binary runs.
[[test]]
name = "spec_tests"
required-features = ["test-macros"]
