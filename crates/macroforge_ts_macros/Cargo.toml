[package]
name = "macroforge_ts_macros"
description = "Derive macros for TypeScript compile-time code generation"
version = "0.1.82"
edition = "2024"
authors = ["macroforge contributors"]
license = "MIT"
repository = "https://github.com/macroforge-ts/macroforge-ts"
homepage = "https://github.com/macroforge-ts/macroforge-ts"
keywords = ["typescript", "macros", "codegen", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.104", features = ["full"] }
convert_case = "0.11.0"


[features]
default = []

[dev-dependencies]
trybuild = "1.0"
macroforge_ts = { version = "0.1.79", path = "../macroforge_ts", features = ["node"] }
napi = "3.0"