[package]
name = "macroforge_ts_macros"
description = "Derive macros for TypeScript compile-time code generation"
version = "0.2.0"
edition = "2024"
authors = ["macroforge contributors"]
license = "MIT"
repository = "https://gitlab.com/macroforge-ts/macroforge-ts"
homepage = "https://macroforge.dev"
keywords = ["typescript", "macros", "codegen", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
convert_case = "0.12.0"


[features]
default = []

[dev-dependencies]
trybuild = "1.0"
macroforge_ts = { version = "0.2.0", path = "../macroforge_ts", features = ["node"] }
napi = "3.12"
