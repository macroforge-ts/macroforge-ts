[package]
name = "macroforge_ts_quote"
description = "Quote macro for generating TypeScript code at compile time"
version = "0.2.0"
edition = "2024"
authors = ["macroforge contributors"]
license = "MIT"
repository = "https://gitlab.com/macroforge-ts/macroforge-ts"
homepage = "https://macroforge.dev"
keywords = ["typescript", "macros", "codegen", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"

[lib]
proc-macro = true

[features]
default = ["oxc"]
swc = ["dep:swc_core", "dep:swc_macros_common"]
oxc = ["dep:oxc"]
# Enable the AST-based compiler for ts_template! macro
# This provides compile-time AST validation but has more complex parsing
compiler = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["proc-macro", "span-locations"] }
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
convert_case = "0.12.0"
rowan = "0.17.0"
anyhow = "1.0"
rustc-hash = "2.1.3"
smallvec = "1.16"

swc_macros_common = { version = "1.0", optional = true }
swc_core = { version = "79.0.0", optional = true, default-features = false, features = [
  "common",
  "ecma_ast",
  "ecma_parser",
  "ecma_visit",
] }

oxc = { version = "0.150", optional = true, features = ["codegen"] }
